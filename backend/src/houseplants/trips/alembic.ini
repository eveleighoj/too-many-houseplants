# Alembic chain for the trips sub-app (tables in the `trips` Postgres schema).
#   uv run alembic -c src/houseplants/trips/alembic.ini upgrade head
# The database URL comes from DATABASE_URL (see common/settings.py), not this file.

[alembic]
script_location = %(here)s/alembic
path_separator = os
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
# Format autogenerated migrations so they match the rest of the codebase.
hooks = ruff_format, ruff_fix
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
