# Local development stack. See docs/local-development.md.
#   docker compose up --build    → API on http://localhost:8000 with live reload
# External APIs are replaced by WireMock services seeded from mocks/ (see compose.env).
# Each frontend runs its Vite dev server as its own service (see docs/frontend.md).

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: houseplant
      POSTGRES_PASSWORD: houseplant
      POSTGRES_DB: houseplant
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U houseplant -d houseplant"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Stands in for the UKHO tidal API; stubs and seeded data in mocks/ukho/.
  ukho-mock:
    image: wiremock/wiremock:3.13.1
    command: --disable-banner
    ports:
      - "8081:8080"
    volumes:
      - ./mocks/ukho:/home/wiremock:ro

  # Stands in for Clerk: serves the JWKS the API verifies tokens against, and ready-made
  # tokens for the dev users (see mocks/clerk/).
  clerk-mock:
    image: wiremock/wiremock:3.13.1
    # CORS headers on every stub, so the frontend can fetch /dev/users from the browser.
    command: --disable-banner --enable-stub-cors
    ports:
      - "8082:8080"
    volumes:
      - ./mocks/clerk:/home/wiremock:ro

  # One-shot: applies every sub-app's migrations, then exits. The api waits for it.
  migrate:
    build: ./backend
    command: python -m houseplants.common.migrations
    env_file: [compose.env, backend/.env]
    environment:
      DATABASE_URL: postgresql://houseplant:houseplant@db:5432/houseplant
    volumes:
      # Current source, not what was baked into the image, so new migrations always run.
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./backend
    command: uvicorn houseplants.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src
    # Later files win: backend/.env overrides compose.env's defaults.
    env_file: [compose.env, backend/.env]
    environment:
      DATABASE_URL: postgresql://houseplant:houseplant@db:5432/houseplant
    ports:
      - "8000:8000"
    volumes:
      # The project is installed editable, so mounting the source gives live reload.
      - ./backend/src:/app/src
    depends_on:
      migrate:
        condition: service_completed_successfully
      ukho-mock:
        condition: service_started
      clerk-mock:
        condition: service_started

  # The trips Svelte frontend on http://localhost:5173, with hot reload.
  trips-frontend:
    image: node:24
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      # Where the browser (on your machine, not in the container) reaches the API.
      VITE_API_URL: http://localhost:8000
      # The login page lists clerk-mock's dev users (see mocks/clerk/).
      VITE_MOCK_AUTH_URL: http://localhost:8082
    ports:
      - "5173:5173"
    volumes:
      - ./trips-frontend:/app
      # The container's own node_modules: some packages ship native binaries that differ
      # between macOS (your checkout) and Linux (the container).
      - trips_frontend_node_modules:/app/node_modules
    depends_on:
      - api
      - clerk-mock

volumes:
  db_data:
  trips_frontend_node_modules:
