# Render Blueprint (https://render.com/docs/blueprint-spec). Not yet deployed — check values
# against the Render dashboard on the first sync. Each frontend is its own free static site; the
# api is one paid web service with one paid Postgres database, both in Frankfurt.
#
# Render never deploys by itself (autoDeployTrigger: off): the Deploy workflow
# (.github/workflows/deploy.yml) triggers each deploy once Test passes on main, waits for it, and
# records it in GitHub. Setup steps: docs/deployment.md.

databases:
  - name: too-many-houseplants-db
    # The smallest paid plan: Render's free Postgres is deleted after 30 days.
    plan: 0.1c-256mb
    region: frankfurt
    # Same major version as local development (docker-compose.yml) and the tests (testcontainers).
    # Can't be changed after creation; upgrade all three together.
    postgresMajorVersion: "16"
    databaseName: houseplant
    # Storage is billed per GB, and Basic plans default to 15 GB; this app needs far less.
    # Can be increased later (to 5, 10, …), never decreased.
    diskSizeGB: 1
    # No outside connections: only services on Render's private network (the api) can reach it.
    # Add your IP here (CIDR, e.g. 203.0.113.7/32) to connect with pgAdmin.
    ipAllowList: []

services:
  - type: web
    name: too-many-houseplants-api
    # Same image as docker compose runs locally: services/api/Dockerfile, built from the repo
    # root. Render builds its last stage (runtime), whose CMD listens on $PORT.
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    # Needs a CNAME at Cloudflare (DNS only) before Render can verify it: docs/deployment.md.
    domains:
      - api.wehavetoomanyhouseplants.co.uk
    # Runs before each deploy goes live; a failed migration stops the deploy.
    preDeployCommand: python -m api.common.migrations
    healthCheckPath: /healthz
    envVars:
      # The database's internal (private network) URL.
      - key: DATABASE_URL
        fromDatabase:
          name: too-many-houseplants-db
          property: connectionString
      # The Clerk production instance's Frontend API URL, e.g. https://clerk.yourdomain.com
      - key: AUTH_ISSUER
        sync: false
      # The frontends' URLs (Clerk puts the requesting origin in each token's `azp`),
      # e.g. https://trips.yourdomain.com
      - key: AUTH_AUTHORIZED_PARTIES
        sync: false
      # The same frontend URLs, for CORS.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UKHO_API_KEY
        sync: false

  - type: web
    name: trips-frontend
    runtime: static
    # An npm workspace: install from the repo root, build just this app.
    buildCommand: npm ci && npm run build -w services/trips-frontend
    staticPublishPath: services/trips-frontend/build
    autoDeployTrigger: "off"
    # Needs a CNAME at Cloudflare (DNS only) before Render can verify it: docs/deployment.md.
    domains:
      - trips.wehavetoomanyhouseplants.co.uk
    envVars:
      # The api's public URL, baked in at build time, e.g. https://api.yourdomain.com
      - key: VITE_API_URL
        sync: false
      # The Clerk production instance's publishable key (pk_live_…). Public, baked in at build.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
    # SPA fallback: serve index.html for every path and let the client-side router handle it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
